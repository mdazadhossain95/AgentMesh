[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentmesh"
version = "0.1.0"
description = "Local orchestration layer for AI coding CLIs: project roles on top, swappable CLI workers underneath."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agentmesh = "agentmesh.cli:main"

[tool.setuptools.packages.find]
include = ["agentmesh*"]

[tool.setuptools.package-data]
agentmesh = ["templates/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
