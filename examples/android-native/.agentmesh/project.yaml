# AgentMesh project config.
# Machine-owned (regenerated by `agentmesh init`): schema, project, detected, roles, verification.
# Human-owned (preserved): manager, routing, fallback, delegation, workers, worktree, references, overrides.
schema: 1
project:
  name: android-native
  kind: mobile
  git: true
  assumptions: []
  answers: {}
detected:
  components:
  - path: .
    type: library
    stack: java/kotlin
    frameworks: []
    details: {}
    inferred: false
  - path: app
    type: mobile
    stack: java/kotlin
    frameworks: []
    details: {}
    inferred: false
  workspace_markers: []
  docs: []
  ci: []
  test_dirs:
  - app/src/test/
  contracts: []
  migrations: []
  localization: []
  sensitive: {}
  instruction_files:
    CLAUDE.md: false
    AGENTS.md: false
    GEMINI.md: false
    QWEN.md: false
roles:
  project-analyst:
    title: Project Analyst
    capability: read-only
    isolation: inplace
    allowed_paths: []
    forbidden_paths:
    - .git/**
    - .env
    - .env.*
    - '**/.env'
    - '**/.env.*'
    - '**/*.pem'
    - '**/*.p12'
    - '**/*.jks'
    - '**/*.keystore'
    - '**/secrets/**'
    - .agentmesh-worktrees/**
    verification: []
    handoff_to:
    - spec-analyst
  spec-analyst:
    title: Spec Analyst
    capability: read-only
    isolation: inplace
    allowed_paths: []
    forbidden_paths:
    - .git/**
    - .env
    - .env.*
    - '**/.env'
    - '**/.env.*'
    - '**/*.pem'
    - '**/*.p12'
    - '**/*.jks'
    - '**/*.keystore'
    - '**/secrets/**'
    - .agentmesh/**
    - .agentmesh-worktrees/**
    verification: []
    handoff_to:
    - app-engineer
  app-engineer:
    title: App Engineer
    capability: write
    isolation: worktree
    allowed_paths:
    - app/**
    forbidden_paths:
    - .git/**
    - .env
    - .env.*
    - '**/.env'
    - '**/.env.*'
    - '**/*.pem'
    - '**/*.p12'
    - '**/*.jks'
    - '**/*.keystore'
    - '**/secrets/**'
    - .agentmesh/**
    - .agentmesh-worktrees/**
    verification:
    - '`gradle test` (in `app`)'
    handoff_to:
    - test-executor
  test-executor:
    title: Test Executor
    capability: read-only
    isolation: worktree
    allowed_paths: []
    forbidden_paths:
    - .git/**
    - .env
    - .env.*
    - '**/.env'
    - '**/.env.*'
    - '**/*.pem'
    - '**/*.p12'
    - '**/*.jks'
    - '**/*.keystore'
    - '**/secrets/**'
    - .agentmesh/**
    - .agentmesh-worktrees/**
    verification:
    - '`gradle test` (in `.`)'
    - '`gradle test` (in `app`)'
    handoff_to:
    - reviewer
    - failure-triage
  failure-triage:
    title: Failure Triage
    capability: read-only
    isolation: worktree
    allowed_paths: []
    forbidden_paths:
    - .git/**
    - .env
    - .env.*
    - '**/.env'
    - '**/.env.*'
    - '**/*.pem'
    - '**/*.p12'
    - '**/*.jks'
    - '**/*.keystore'
    - '**/secrets/**'
    - .agentmesh/**
    - .agentmesh-worktrees/**
    verification: []
    handoff_to:
    - app-engineer
  reviewer:
    title: Reviewer
    capability: read-only
    isolation: worktree
    allowed_paths: []
    forbidden_paths:
    - .git/**
    - .env
    - .env.*
    - '**/.env'
    - '**/.env.*'
    - '**/*.pem'
    - '**/*.p12'
    - '**/*.jks'
    - '**/*.keystore'
    - '**/secrets/**'
    - .agentmesh/**
    - .agentmesh-worktrees/**
    verification: []
    handoff_to: []
verification:
  commands:
  - component: .
    name: test
    cwd: .
    run: gradle test
  - component: app
    name: test
    cwd: app
    run: gradle test
manager:
  default: claude
  bootstrap_files:
  - CLAUDE.md
  - AGENTS.md
routing:
  strategy: balanced
  preferred_order:
  - claude
  - codex
  - antigravity
  - opencode
  - cline
  - kiro
  - copilot
  - kilo
  quality_order:
  - claude
  - kiro
  - copilot
  - kilo
  - codex
  - opencode
  - cline
  - antigravity
  free_workers: []
  disabled: []
  allow_unverified: false
  roles: {}
fallback:
  enabled: true
  max_attempts: 3
  'on':
  - QUOTA_EXCEEDED
  - RATE_LIMITED
  - AUTH_FAILED
  - CLI_NOT_FOUND
  - TIMEOUT
  - PROVIDER_UNAVAILABLE
  - UNSUPPORTED
  cooldown_seconds:
    QUOTA_EXCEEDED: 3600
    RATE_LIMITED: 300
    AUTH_FAILED: 3600
    CLI_NOT_FOUND: 3600
    TIMEOUT: 0
    PROVIDER_UNAVAILABLE: 120
    UNSUPPORTED: 3600
delegation:
  max_depth: 1
workers:
  autonomy: edit
  timeout_seconds: 1800
  extra_args: {}
  role_autonomy: {}
  models:
    opencode:
    - opencode/big-pickle
    - nvidia/nvidia/nemotron-3-super-120b-a12b
    - nvidia/deepseek-ai/deepseek-v4.1-flash
    - nvidia/poolside/laguna-xs-2.1
    - nvidia/z-ai/glm-5.3
    - nvidia/nvidia/nemotron-3.5-lightning-30b-a3b
    - nvidia/openai/gpt-oss-20b
    kilo:
    - kilo/dots-studio/dots-3-note-preview:free
    - kilo/cohere/north-mini-code:free
    - kilo/nvidia/nemotron-3-ultra-550b-a55b:free
    - kilo/poolside/laguna-s-2.1:free
    - kilo/nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free
    - kilo/nvidia/nemotron-3-super-120b-a12b:free
    - kilo/poolside/laguna-xs-2.1:free
    - kilo/nvidia/nemotron-3.5-lightning:free
    - kilo/liquid/lfm-2.5-2.6b:free
    kiro:
    - deepseek-3.2
    - claude-sonnet-4.5
    - auto
    - claude-haiku-4.5
    - minimax-m2.1
    - minimax-m2.5
    - qwen3-coder-next
    - glm-5
worktree:
  enabled: true
  dir: .agentmesh-worktrees
  auto_commit: true
enforcement:
  mode: block
  allow_paths:
  - .agentmesh/**
  - .claude/**
  - .gitignore
  - CLAUDE.md
  - AGENTS.md
  - '**/*.md'
  - docs/**
  stop_check: true
  stop_window_hours: 12
  claude_hooks: true
parallel:
  max_workers: 3
risk:
  high_paths: []
  low_paths: []
review:
  mode: auto
  require_different_worker: true
economy:
  mode: auto
references: []
overrides:
  roles: {}
custom_roles: {}
