# AgentMesh project config.
# Machine-owned (regenerated by `agentmesh init`): schema, project, detected, roles, verification.
# Human-owned (preserved): manager, routing, fallback, delegation, workers, worktree, references, overrides.
schema: 1
project:
  name: GoVio
  kind: full-stack
  git: true
  assumptions: []
  answers: {}
detected:
  components:
  - path: .
    type: mobile
    stack: flutter
    frameworks:
    - flutter
    details:
      platforms:
      - android
      - ios
      state_management:
      - riverpod
      routing:
      - go_router
      networking:
      - dio
      storage:
      - flutter_secure_storage
      codegen: []
      sdk_constraint: ^3.4.0
      has_l10n: true
      top_level_lib_dirs:
      - features
      - l10n
    inferred: false
  - path: backend
    type: backend
    stack: python
    frameworks:
    - fastapi
    details:
      database:
      - alembic
      - sqlalchemy
      has_pytest: true
      migrations_tool: alembic
    inferred: false
  workspace_markers: []
  docs:
  - README.md
  - docs/
  ci: []
  test_dirs:
  - backend/tests/
  - test/
  contracts:
  - docs/openapi.yaml
  migrations: []
  localization:
  - l10n.yaml
  sensitive:
    security:
    - dependency:flutter_secure_storage
    - lib/features/auth
    - lib/features/auth/login
  instruction_files:
    CLAUDE.md: false
    AGENTS.md: false
    GEMINI.md: false
    QWEN.md: false
roles:
  project-analyst:
    title: Project Analyst
    capability: read-only
    isolation: inplace
    allowed_paths: []
    forbidden_paths:
    - .git/**
    - .env
    - .env.*
    - '**/.env'
    - '**/.env.*'
    - '**/*.pem'
    - '**/*.p12'
    - '**/*.jks'
    - '**/*.keystore'
    - '**/secrets/**'
    - .agentmesh-worktrees/**
    verification: []
    handoff_to:
    - spec-analyst
  spec-analyst:
    title: Spec Analyst
    capability: read-only
    isolation: inplace
    allowed_paths: []
    forbidden_paths:
    - .git/**
    - .env
    - .env.*
    - '**/.env'
    - '**/.env.*'
    - '**/*.pem'
    - '**/*.p12'
    - '**/*.jks'
    - '**/*.keystore'
    - '**/secrets/**'
    - .agentmesh/**
    - .agentmesh-worktrees/**
    verification: []
    handoff_to:
    - contract-keeper
    - backend-engineer
    - app-engineer
  contract-keeper:
    title: Contract Keeper
    capability: write
    isolation: worktree
    allowed_paths:
    - '**/openapi*.yaml'
    - '**/openapi*.yml'
    - '**/openapi*.json'
    - '**/swagger*.json'
    - '**/swagger*.yaml'
    - '**/*.proto'
    - '**/*.graphql'
    - docs/api/**
    - contracts/**
    forbidden_paths:
    - .git/**
    - .env
    - .env.*
    - '**/.env'
    - '**/.env.*'
    - '**/*.pem'
    - '**/*.p12'
    - '**/*.jks'
    - '**/*.keystore'
    - '**/secrets/**'
    - .agentmesh/**
    - .agentmesh-worktrees/**
    verification:
    - Contract files parse (YAML/JSON/proto) and match the shapes in the task.
    handoff_to:
    - backend-engineer
    - app-engineer
  backend-engineer:
    title: Backend Engineer
    capability: write
    isolation: worktree
    allowed_paths:
    - backend/**
    forbidden_paths:
    - .git/**
    - .env
    - .env.*
    - '**/.env'
    - '**/.env.*'
    - '**/*.pem'
    - '**/*.p12'
    - '**/*.jks'
    - '**/*.keystore'
    - '**/secrets/**'
    - .agentmesh/**
    - .agentmesh-worktrees/**
    - '**/openapi*.yaml'
    - '**/openapi*.yml'
    - '**/openapi*.json'
    - '**/swagger*.json'
    - '**/swagger*.yaml'
    - '**/*.proto'
    - '**/*.graphql'
    - docs/api/**
    - contracts/**
    verification:
    - '`pytest` (in `backend`)'
    handoff_to:
    - test-executor
  app-engineer:
    title: App Engineer
    capability: write
    isolation: worktree
    allowed_paths:
    - lib/**
    - test/**
    - assets/**
    - l10n/**
    - pubspec.yaml
    - pubspec.lock
    forbidden_paths:
    - .git/**
    - .env
    - .env.*
    - '**/.env'
    - '**/.env.*'
    - '**/*.pem'
    - '**/*.p12'
    - '**/*.jks'
    - '**/*.keystore'
    - '**/secrets/**'
    - .agentmesh/**
    - .agentmesh-worktrees/**
    - '**/openapi*.yaml'
    - '**/openapi*.yml'
    - '**/openapi*.json'
    - '**/swagger*.json'
    - '**/swagger*.yaml'
    - '**/*.proto'
    - '**/*.graphql'
    - docs/api/**
    - contracts/**
    verification:
    - '`dart format --output=none --set-exit-if-changed lib test` (in `.`)'
    - '`flutter analyze` (in `.`)'
    - '`flutter test` (in `.`)'
    handoff_to:
    - test-executor
  test-executor:
    title: Test Executor
    capability: read-only
    isolation: worktree
    allowed_paths: []
    forbidden_paths:
    - .git/**
    - .env
    - .env.*
    - '**/.env'
    - '**/.env.*'
    - '**/*.pem'
    - '**/*.p12'
    - '**/*.jks'
    - '**/*.keystore'
    - '**/secrets/**'
    - .agentmesh/**
    - .agentmesh-worktrees/**
    verification:
    - '`dart format --output=none --set-exit-if-changed lib test` (in `.`)'
    - '`flutter analyze` (in `.`)'
    - '`flutter test` (in `.`)'
    - '`pytest` (in `backend`)'
    handoff_to:
    - reviewer
    - failure-triage
  failure-triage:
    title: Failure Triage
    capability: read-only
    isolation: worktree
    allowed_paths: []
    forbidden_paths:
    - .git/**
    - .env
    - .env.*
    - '**/.env'
    - '**/.env.*'
    - '**/*.pem'
    - '**/*.p12'
    - '**/*.jks'
    - '**/*.keystore'
    - '**/secrets/**'
    - .agentmesh/**
    - .agentmesh-worktrees/**
    verification: []
    handoff_to:
    - backend-engineer
    - app-engineer
  reviewer:
    title: Reviewer
    capability: read-only
    isolation: worktree
    allowed_paths: []
    forbidden_paths:
    - .git/**
    - .env
    - .env.*
    - '**/.env'
    - '**/.env.*'
    - '**/*.pem'
    - '**/*.p12'
    - '**/*.jks'
    - '**/*.keystore'
    - '**/secrets/**'
    - .agentmesh/**
    - .agentmesh-worktrees/**
    verification: []
    handoff_to:
    - security-reviewer
  security-reviewer:
    title: Security Reviewer
    capability: read-only
    isolation: worktree
    allowed_paths: []
    forbidden_paths:
    - .git/**
    - .env
    - .env.*
    - '**/.env'
    - '**/.env.*'
    - '**/*.pem'
    - '**/*.p12'
    - '**/*.jks'
    - '**/*.keystore'
    - '**/secrets/**'
    - .agentmesh/**
    - .agentmesh-worktrees/**
    verification: []
    handoff_to: []
verification:
  commands:
  - component: .
    name: format
    cwd: .
    run: dart format --output=none --set-exit-if-changed lib test
  - component: .
    name: analyze
    cwd: .
    run: flutter analyze
  - component: .
    name: test
    cwd: .
    run: flutter test
  - component: backend
    name: test
    cwd: backend
    run: pytest
manager:
  default: claude
  bootstrap_files:
  - CLAUDE.md
  - AGENTS.md
routing:
  strategy: balanced
  preferred_order:
  - claude
  - codex
  - antigravity
  - gemini
  - qwen
  - opencode
  - command-code
  quality_order:
  - claude
  - codex
  - antigravity
  - gemini
  - qwen
  - opencode
  - command-code
  free_workers: []
  disabled: []
  allow_unverified: false
  roles: {}
fallback:
  enabled: true
  max_attempts: 3
  'on':
  - QUOTA_EXCEEDED
  - RATE_LIMITED
  - AUTH_FAILED
  - CLI_NOT_FOUND
  - TIMEOUT
  - PROVIDER_UNAVAILABLE
  - UNSUPPORTED
  cooldown_seconds:
    QUOTA_EXCEEDED: 3600
    RATE_LIMITED: 300
    AUTH_FAILED: 3600
    CLI_NOT_FOUND: 3600
    TIMEOUT: 0
    PROVIDER_UNAVAILABLE: 120
    UNSUPPORTED: 3600
delegation:
  max_depth: 1
workers:
  autonomy: edit
  timeout_seconds: 1800
  extra_args: {}
  role_autonomy: {}
  models: {}
worktree:
  enabled: true
  dir: .agentmesh-worktrees
  auto_commit: true
references: []
overrides:
  roles: {}
