# agentmesh:generated sha256=50749e2e38de (edit freely: modified files are never overwritten)
schema: 1
project: GoVio
kind: full-stack
principle: Roles are fixed by this file; workers are chosen per run by the AgentMesh router.
stages:
- id: spec
  role: spec-analyst
  when:
    any_of:
    - feature
    - multi_area
    - ambiguous
  skip_when:
  - trivial
  purpose: Pin down requirements and acceptance criteria.
- id: contract
  role: contract-keeper
  when:
    any_of:
    - api
  purpose: Update API/data contracts before implementations.
- id: implement-backend
  role: backend-engineer
  when:
    any_of:
    - backend
    - api
  kind: implementation
  purpose: Make the change in isolation (git worktree).
- id: implement-app
  role: app-engineer
  when:
    any_of:
    - app
  kind: implementation
  purpose: Make the change in isolation (git worktree).
- id: test
  role: test-executor
  after: implementation
  purpose: Run verification commands against the implemented worktree.
- id: triage
  role: failure-triage
  on_failure_of:
  - test
  - review
  purpose: Diagnose; produce a focused correction brief for the owning role.
- id: review
  role: reviewer
  always: true
  purpose: Review the real diff before the manager accepts it.
- id: security-review
  role: security-reviewer
  when:
    any_of:
    - security
  purpose: Specialist review when the change touches this area.
- id: manager-verify
  actor: manager
  always: true
  purpose: Inspect git diff, run `agentmesh verify`, only then accept/integrate.
